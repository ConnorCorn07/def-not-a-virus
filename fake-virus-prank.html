<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>System Warning</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Taskbar (kept in the HTML so style.css stays untouched) */
  #taskbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 46px;
    z-index: 5000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(18, 28, 48, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    user-select: none;
  }
  #taskbar .tb-icons { display: flex; gap: 4px; align-items: center; }
  #taskbar .tb-btn {
    position: relative;
    width: 40px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: none; border-radius: 6px;
    color: #fff; font-size: 17px; cursor: default;
  }
  #taskbar .tb-btn:hover { background: rgba(255, 255, 255, 0.14); }
  #taskbar .tb-btn.active::after {
    content: ""; position: absolute; bottom: 2px; left: 50%;
    width: 14px; height: 3px; margin-left: -7px;
    border-radius: 2px; background: #6cb6ff;
  }
  #taskbar .tb-btn svg { width: 18px; height: 18px; }
  #taskbar .tb-tray {
    position: absolute; right: 12px; top: 0; bottom: 0;
    display: flex; align-items: center; gap: 12px;
    color: #fff; font-size: 12px; text-align: right; line-height: 1.2;
  }
  #taskbar .tb-tray .tray-icon { font-size: 13px; opacity: 0.9; }
  /* Pins spawned by popups: shrink as they pile up, stay clear of the tray */
  #taskbar .tb-icons { max-width: calc(100% - 440px); overflow: hidden; }
  #taskbar .tb-btn.pin {
    flex: 0 1 40px; width: auto; min-width: 8px; padding: 0; overflow: hidden;
  }
  /* Lift the HUD above the taskbar */
  #hud { bottom: 60px; }
</style>
</head>
<body>

<div id="desktop-msg">
  <h1>Everything is fine.</h1>
  <p>Probably.</p>
</div>

<div id="hud">
  <span>Active infections: <b id="count">1</b></span>
  <span>Infection level: <b id="level">1%</b></span>
  <button id="mercy" title="The real way out">end the joke</button>
</div>

<div id="taskbar">
  <div class="tb-icons">
    <button class="tb-btn" title="Start" aria-label="Start">
      <svg viewBox="0 0 18 18" fill="#4cc2ff">
        <rect x="0" y="0" width="8.4" height="8.4"/>
        <rect x="9.6" y="0" width="8.4" height="8.4"/>
        <rect x="0" y="9.6" width="8.4" height="8.4"/>
        <rect x="9.6" y="9.6" width="8.4" height="8.4"/>
      </svg>
    </button>
    <button class="tb-btn" title="Search" aria-label="Search">🔍</button>
    <button class="tb-btn" title="Task View" aria-label="Task View">🗔</button>
    <button class="tb-btn" title="File Explorer" aria-label="File Explorer">📁</button>
    <button class="tb-btn active" title="Browser" aria-label="Browser">🌐</button>
    <button class="tb-btn active" title="Windows Security" aria-label="Windows Security">🛡️</button>
  </div>
  <div class="tb-tray">
    <span class="tray-icon">^</span>
    <span class="tray-icon">📶</span>
    <span class="tray-icon">🔊</span>
    <div id="clock"><div id="clock-time"></div><div id="clock-date"></div></div>
  </div>
</div>

<script src="script.js"></script>
<script>
  // Taskbar clock
  function tickClock() {
    const now = new Date();
    document.getElementById('clock-time').textContent =
      now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    document.getElementById('clock-date').textContent =
      now.toLocaleDateString([], { month: 'numeric', day: 'numeric', year: 'numeric' });
  }
  tickClock();
  setInterval(tickClock, 1000);
</script>
</body>
</html>
