<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>System Warning</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", Tahoma, Arial, sans-serif; }
  body { background: #0078d7; height: 100vh; overflow: hidden; }
  #desktop-msg {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: white; text-align: center; opacity: 0.85; pointer-events: none;
  }
  #desktop-msg h1 { font-size: 28px; font-weight: 300; margin-bottom: 8px; }
  #desktop-msg p { font-size: 15px; }
  .popup {
    position: absolute; width: 340px; background: #f0f0f0; border: 1px solid #555;
    box-shadow: 6px 6px 18px rgba(0,0,0,.5); user-select: none; z-index: 10;
  }
  .titlebar {
    background: linear-gradient(#d32f2f, #b71c1c); color: #fff; padding: 6px 10px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; font-weight: 600; cursor: move;
  }
  .titlebar .x {
    background: #e81123; border: 1px solid #ffb3ba; color: #fff; width: 22px; height: 18px;
    line-height: 15px; text-align: center; cursor: pointer; font-size: 12px;
  }
  .body { padding: 14px; display: flex; gap: 12px; }
  .icon { font-size: 40px; line-height: 1; }
  .text { font-size: 13px; color: #111; }
  .text b { color: #b71c1c; }
  .text .small { font-size: 11px; color: #555; margin-top: 6px; }
  .footer { padding: 0 14px 14px; text-align: center; }
  .stop-btn {
    background: #d32f2f; color: #fff; border: none; padding: 9px 18px; font-size: 14px;
    font-weight: 700; cursor: pointer; border-radius: 3px; width: 100%;
    animation: blink 0.8s steps(2) infinite;
  }
  .stop-btn:hover { background: #ff1744; }
  @keyframes blink { 50% { filter: brightness(1.35); } }
  #hud {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.65); color: #fff; padding: 8px 18px; border-radius: 20px;
    font-size: 13px; z-index: 9999; display: flex; gap: 18px; align-items: center;
  }
  #hud button {
    background: transparent; color: #9e9e9e; border: 1px solid #666; border-radius: 12px;
    padding: 3px 10px; font-size: 11px; cursor: pointer;
  }
  #hud button:hover { color: #fff; border-color: #fff; }
</style>
</head>
<body>

<div id="desktop-msg">
  <h1>Everything is fine.</h1>
  <p>Probably.</p>
</div>

<div id="hud">
  <span>Active infections: <b id="count">1</b></span>
  <span>Infection level: <b id="level">1%</b></span>
  <button id="mercy" title="The real way out">end the joke</button>
</div>

<script>
  const warnings = [
    { t: "⚠ SYSTEM WARNING", h: "YOUR COMPUTER IS INFECTED!", b: "A dangerous virus has been detected on this device.", d: "Threat: Trojan.Win32.TotallyReal" },
    { t: "⚠ VIRUS DETECTED", h: "MALWARE FOUND!", b: "Your files are being encrypted RIGHT NOW.", d: "Threat: Ransomware.ProbablyFine" },
    { t: "⚠ CRITICAL ALERT", h: "DO NOT CLOSE THIS WINDOW", b: "Closing this window will not help. It never helps.", d: "Threat: Win32.ClickMe" },
    { t: "⚠ SECURITY BREACH", h: "HACKERS ARE INSIDE", b: "A hacker in a hoodie is downloading your RAM.", d: "IP traced: 127.0.0.1 (very close)" },
    { t: "⚠ TROJAN WARNING", h: "47 VIRUSES FOUND", b: "Your computer has more viruses than a hospital.", d: "Threat: Adware.PopUpGenerator" },
    { t: "⚠ URGENT", h: "YOUR HARD DRIVE IS SAD", b: "Morale in sector 7G has collapsed completely.", d: "Threat: EmotionalDamage.exe" },
    { t: "⚠ FINAL WARNING", h: "THIS IS THE FINAL WARNING", b: "There will be more final warnings. Many more.", d: "Threat: Spam.Popup.Recursive" },
    { t: "⚠ SYSTEM WARNING", h: "ERROR: TOO MANY WARNINGS", b: "The warning system itself is now infected.", d: "Threat: Meta.Virus.Joke" }
  ];
  let popups = 0;
  const MAX = 160;
  let dragTarget = null, dragOffX = 0, dragOffY = 0;

  const countEl = document.getElementById('count');
  const levelEl = document.getElementById('level');

  function updateHud() {
    countEl.textContent = popups;
    levelEl.textContent = Math.min(99, popups) + "%";
  }

  function spawnPopup() {
    if (popups >= MAX) return;
    const w = warnings[Math.floor(Math.random() * warnings.length)];
    const el = document.createElement('div');
    el.className = 'popup';
    const maxX = Math.max(0, window.innerWidth - 360);
    const maxY = Math.max(0, window.innerHeight - 230);
    el.style.left = Math.floor(Math.random() * maxX) + 'px';
    el.style.top = Math.floor(Math.random() * maxY) + 'px';
    el.style.zIndex = 10 + Math.floor(Math.random() * 500);
    el.innerHTML =
      '<div class="titlebar"><span>' + w.t + '</span><span class="x">✕</span></div>' +
      '<div class="body"><div class="icon">☠</div><div class="text"><b>' + w.h + '</b><br>' + w.b +
      '<div class="small">' + w.d + '</div></div></div>' +
      '<div class="footer"><button class="stop-btn">CLICK HERE TO STOP THE INFECTION</button></div>';

    // The big red button: closes this one... and spawns two more.
    el.querySelector('.stop-btn').addEventListener('click', () => {
      el.remove(); popups--;
      spawnPopup(); spawnPopup();
      updateHud();
    });
    // The X button is worse. Obviously.
    el.querySelector('.x').addEventListener('click', () => {
      el.remove(); popups--;
      spawnPopup(); spawnPopup(); spawnPopup();
      updateHud();
    });
    // Dragging by the titlebar
    const bar = el.querySelector('.titlebar');
    bar.addEventListener('mousedown', (e) => {
      dragTarget = el;
      dragOffX = e.clientX - el.offsetLeft;
      dragOffY = e.clientY - el.offsetTop;
      el.style.zIndex = 999;
    });

    document.body.appendChild(el);
    popups++;
  }

  document.addEventListener('mousemove', (e) => {
    if (!dragTarget) return;
    dragTarget.style.left = (e.clientX - dragOffX) + 'px';
    dragTarget.style.top = (e.clientY - dragOffY) + 'px';
  });
  document.addEventListener('mouseup', () => dragTarget = null);

  // The mercy button: actually ends it.
  document.getElementById('mercy').addEventListener('click', () => {
    document.querySelectorAll('.popup').forEach(p => p.remove());
    popups = 0; updateHud();
    document.querySelector('#desktop-msg h1').textContent = "It was a joke. Your computer is fine.";
    document.querySelector('#desktop-msg p').textContent = "It was always fine.";
  });

  spawnPopup();
  updateHud();
</script>
</body>
</html>
